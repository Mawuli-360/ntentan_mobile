name: ntentan
description: "Ntentan — Health Track App for Accessibility"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  audio_waveforms:
    git: https://github.com/Mawuli-360/audio_waveforms.git
  audioplayers: ^6.6.0
  camera: ^0.11.2
  cloud_firestore: ^6.2.0
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  drift: ^2.23.1
  firebase_auth: ^6.3.0
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  fl_chart: ^0.70.2
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_dotenv: ^5.2.1
  flutter_local_notifications: ^19.5.0
  flutter_secure_storage: ^9.2.2
  flutter_spinkit: ^5.2.2
  flutter_svg: ^2.2.0
  flutter_tts: ^4.2.5
  fpdart: ^1.1.0
  freezed_annotation: ^3.0.0
  geolocator: ^13.0.0
  get_it: ^8.0.3
  go_router: ^14.8.1
  google_sign_in: ^7.1.1
  http: ^1.6.0
  iconsax_flutter: ^1.0.0
  json_annotation: ^4.9.0
  logger: ^2.6.2
  lottie: ^3.3.1
  path: ^1.9.0
  path_provider: ^2.1.5
  percent_indicator: ^4.2.3
  provider: ^6.1.2
  shared_preferences: ^2.3.4
  socket_io_client: ^3.1.4
  sqlite3_flutter_libs: ^0.5.28
  timezone: ^0.10.1
  vibration: ^3.1.8
  web_socket_channel: ^3.0.3
  wolt_modal_sheet: ^0.11.0

dev_dependencies:
  accessibility_tools: ^2.5.0
  build_runner: ^2.4.14
  drift_dev: ^2.23.1
  flutter_flavorizr: ^2.3.1
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.4
  flutter_test:
    sdk: flutter
  freezed: ^3.0.0
  json_serializable: ^6.9.4
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icons/
    - assets/images/
    - assets/animations/

  fonts:
    - family: LexendDeca
      fonts:
        - asset: assets/fonts/Lexend_Deca/static/LexendDeca-Thin.ttf
          weight: 100
        - asset: assets/fonts/Lexend_Deca/static/LexendDeca-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Lexend_Deca/static/LexendDeca-Light.ttf
          weight: 300
        - asset: assets/fonts/Lexend_Deca/static/LexendDeca-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lexend_Deca/static/LexendDeca-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lexend_Deca/static/LexendDeca-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lexend_Deca/static/LexendDeca-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lexend_Deca/static/LexendDeca-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Lexend_Deca/static/LexendDeca-Black.ttf
          weight: 900
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/Atkinson_Hyperlegible/AtkinsonHyperlegible-Regular.ttf
          weight: 400
        - asset: assets/fonts/Atkinson_Hyperlegible/AtkinsonHyperlegible-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Atkinson_Hyperlegible/AtkinsonHyperlegible-Bold.ttf
          weight: 700
        - asset: assets/fonts/Atkinson_Hyperlegible/AtkinsonHyperlegible-BoldItalic.ttf
          weight: 700
          style: italic
    - family: NotoSans
      fonts:
        - asset: assets/fonts/noto/NotoSans-Regular.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/ntentan_padded.png"
  adaptive_icon_background: "#0A0F1A"
  adaptive_icon_foreground: "assets/icons/ntentan_padded.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0A0F1A"
  image: "assets/icons/ntentan_cropped.png"
  android: true
  ios: true
  web: false

  android_12:
    color: "#0A0F1A"
    image: "assets/icons/ntentan_cropped.png"
    icon_background_color: "#0A0F1A"
